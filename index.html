<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>English Playroom</title>

  <!-- Playful balloon-like Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ===================================================
       RESET & BASE
       =================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Arial Rounded MT Bold', 'Nunito', sans-serif;
    }

    /* ===================================================
       SOFT PASTEL COLOR PALETTE
       =================================================== */
    :root {
      --bg-hub:        #FEF3E2;
      --bg-flash:      #E0F2FE;
      --bg-memory:     #EDE9FE;
      --bg-pony:       #FCE7F3;
      --bg-count:      #ECFCCB;
      --bg-drums:      #FEF9C3;

      --card-back:     #C4B5FD;
      --card-front:    #FFFFFF;

      --btn-shadow:    rgba(0, 0, 0, 0.08);
      --btn-active:    rgba(0, 0, 0, 0.04);

      --pastel-pink:   #FBCFE8;
      --pastel-blue:   #BAE6FD;
      --pastel-green:  #BBF7D0;
      --pastel-yellow: #FDE68A;
      --pastel-orange: #FED7AA;
      --pastel-violet: #DDD6FE;

      --radius-sm:     16px;
      --radius-md:     24px;
      --radius-lg:     32px;
      --radius-full:   9999px;

      --gap:           24px;
      --gap-lg:        32px;

      --title-color:   #7C6F64;
      --label-color:   #9C8E82;

      --font-balloon:  'Sour Gummy', 'Comic Sans MS', cursive;
    }

    /* ===================================================
       SCREEN CONTAINER
       =================================================== */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--gap-lg);
      padding-top: calc(var(--gap-lg) + env(safe-area-inset-top, 0px));
      padding-bottom: calc(var(--gap-lg) + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      overflow-x: hidden;
    }

    .screen.active {
      display: flex;
    }

    /* ===================================================
       BACK BUTTON  (🏠 emoji — top-left of every game)
       =================================================== */
    .back-btn {
      position: absolute;
      top: var(--gap);
      left: var(--gap);
      width: 80px;
      height: 80px;
      border: none;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 12px var(--btn-shadow);
      font-size: 40px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .back-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 18px var(--btn-shadow);
    }

    .back-btn:active {
      transform: scale(0.93);
      background: var(--btn-active);
      box-shadow: 0 2px 6px var(--btn-shadow);
    }

    /* ===================================================
       1.  CO-PLAY HUB  (Main Menu)
       =================================================== */
    #hub {
      background: var(--bg-hub);
      gap: 20px;
      justify-content: flex-start;
      padding-top: 36px;
    }

    .hub-title {
      font-family: var(--font-balloon);
      font-size: 26px;
      font-weight: 700;
      color: var(--title-color);
      text-align: center;
      line-height: 1.35;
      padding: 0 var(--gap);
    }

    .hub-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--gap);
      width: 100%;
      max-width: 600px;
      padding: 4px;
    }

    /* --- Individual hub button --- */
    .hub-btn {
      width: 155px;
      height: 170px;
      border: none;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 12px 8px 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--btn-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }

    .hub-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 28px var(--btn-shadow);
    }

    .hub-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px var(--btn-shadow);
    }

    /* Massive emoji inside each hub button */
    .hub-emoji {
      font-size: 80px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* Parent-readable label beneath the emoji */
    .hub-label {
      font-family: var(--font-balloon);
      font-size: 16px;
      font-weight: 400;
      color: var(--label-color);
      white-space: nowrap;
      line-height: 1.2;
    }

    /* Per-game pastel backgrounds */
    .hub-btn[data-game="flash"]   { background: var(--pastel-blue);   }
    .hub-btn[data-game="memory"]  { background: var(--pastel-violet); }
    .hub-btn[data-game="pony"]    { background: var(--pastel-pink);   }
    .hub-btn[data-game="count"]   { background: var(--pastel-green);  }
    .hub-btn[data-game="drums"]   { background: var(--pastel-yellow); }

    /* ===================================================
       2.  DAILY FLASHCARDS — Proactive Two-Card Layout
       =================================================== */
    #flash {
      background: var(--bg-flash);
      gap: var(--gap-lg);
    }

    .flash-pair {
      display: flex;
      gap: var(--gap-lg);
      justify-content: center;
      align-items: stretch;
    }

    .flash-choice {
      width: 155px;
      height: 210px;
      border: 4px solid transparent;
      border-radius: var(--radius-lg);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      padding: 12px;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.3s ease, background 0.3s ease;
    }

    .flash-choice:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 28px var(--btn-shadow);
    }

    .flash-choice:active {
      transform: scale(0.95);
    }

    .flash-emoji {
      font-size: 80px;
      line-height: 1;
    }

    .flash-word {
      font-family: var(--font-balloon);
      font-size: 28px;
      font-weight: 700;
      color: var(--title-color);
      min-height: 36px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .flash-word.visible {
      opacity: 1;
    }

    /* Correct answer glow */
    .flash-choice.correct {
      border-color: #86EFAC;
      background: #F0FFF4;
    }

    /* ===================================================
       3.  MEMORY MATCH SCREEN
       =================================================== */
    #memory {
      background: var(--bg-memory);
    }

    .memory-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap-lg);
      width: 100%;
      max-width: 420px;
    }

    /* Card wrapper (perspective container) */
    .card {
      aspect-ratio: 3 / 4;
      min-height: 120px;
      perspective: 600px;
      cursor: pointer;
    }

    /* Inner card that flips */
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease;
      transform-style: preserve-3d;
      border-radius: var(--radius-md);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* Shared face styling */
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-md);
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--btn-shadow);
      overflow: hidden;
    }

    /* Back face (what you see first) */
    .card-back {
      background: var(--card-back);
      font-size: 56px;
    }

    /* Front face (hidden until flip) */
    .card-front {
      background: var(--card-front);
      transform: rotateY(180deg);
      font-size: 64px;
    }

    /* hover / active feedback on cards */
    .card:hover .card-inner {
      filter: brightness(1.04);
    }

    .card:active .card-inner {
      transform: scale(0.95);
    }

    .card.flipped:active .card-inner {
      transform: rotateY(180deg) scale(0.95);
    }

    /* ===================================================
       4.  PONY MORNING ROUTINE SCREEN
       =================================================== */
    #pony {
      background: var(--bg-pony);
      gap: var(--gap-lg);
    }

    .pony-character {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      line-height: 1;
    }

    .pony-actions {
      display: flex;
      gap: var(--gap-lg);
      flex-wrap: wrap;
      justify-content: center;
    }

    .pony-btn {
      width: 110px;
      height: 110px;
      border: none;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 4px 16px var(--btn-shadow);
      font-size: 50px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .pony-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 22px var(--btn-shadow);
    }

    .pony-btn:active {
      transform: scale(0.92);
      background: var(--pastel-pink);
      box-shadow: 0 2px 8px var(--btn-shadow);
    }

    .pony-btn.done {
      background: var(--pastel-green);
    }

    /* ===================================================
       5.  LET'S COUNT SCREEN
       =================================================== */
    #count {
      background: var(--bg-count);
      gap: var(--gap-lg);
    }

    .count-objects {
      display: flex;
      gap: var(--gap-lg);
      flex-wrap: wrap;
      justify-content: center;
    }

    .count-item {
      width: 100px;
      height: 100px;
      border-radius: var(--radius-md);
      background: #FFFFFF;
      box-shadow: 0 4px 14px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      line-height: 1;
      transition: transform 0.15s ease;
    }

    .count-item:active {
      transform: scale(0.92);
    }

    .count-number {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-balloon);
      font-size: 80px;
      font-weight: 700;
      color: var(--title-color);
    }

    /* ===================================================
       6.  RHYTHM & SYLLABLES SCREEN
       =================================================== */
    #drums {
      background: var(--bg-drums);
      justify-content: space-between;
    }

    .drums-image {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      line-height: 1;
    }

    .drums-row {
      display: flex;
      gap: var(--gap-lg);
      justify-content: center;
      padding-bottom: var(--gap);
    }

    .drum {
      width: 130px;
      height: 130px;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(145deg, var(--pastel-orange), #FDBA74);
      box-shadow: 0 8px 24px var(--btn-shadow), inset 0 -4px 0 rgba(0,0,0,0.06);
      font-size: 60px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .drum:hover {
      transform: scale(1.06);
      box-shadow: 0 10px 30px var(--btn-shadow), inset 0 -4px 0 rgba(0,0,0,0.06);
    }

    .drum:active {
      transform: scale(0.9);
      box-shadow: 0 2px 8px var(--btn-shadow), inset 0 2px 0 rgba(0,0,0,0.04);
    }

    /* ===================================================
       RESPONSIVE — Small phones (≤ 380px)
       =================================================== */
    @media (max-width: 380px) {
      .hub-title       { font-size: 21px; }
      .hub-btn         { width: 130px; height: 145px; }
      .hub-emoji       { font-size: 64px; }
      .hub-label       { font-size: 13px; }
      .flash-choice    { width: 130px; height: 175px; }
      .flash-emoji     { font-size: 64px; }
      .flash-word      { font-size: 22px; }
      .pony-character  { width: 130px; height: 130px; font-size: 72px; }
      .pony-btn        { width: 90px;  height: 90px;  font-size: 40px; }
      .count-item      { width: 80px;  height: 80px;  font-size: 48px; }
      .count-number    { width: 130px; height: 130px; font-size: 64px; }
      .drum            { width: 110px; height: 110px; font-size: 48px; }
      .drums-image     { width: 130px; height: 130px; font-size: 72px; }
    }

    /* ===================================================
       RESPONSIVE — Tablets / landscape (≥ 768px)
       =================================================== */
    @media (min-width: 768px) {
      .hub-title       { font-size: 34px; }
      .hub-grid        { max-width: 750px; gap: 36px; }
      .hub-btn         { width: 200px; height: 220px; }
      .hub-emoji       { font-size: 100px; }
      .hub-label       { font-size: 18px; }
      .flash-choice    { width: 200px; height: 270px; }
      .flash-emoji     { font-size: 110px; }
      .flash-word      { font-size: 36px; }
      .memory-grid     { max-width: 520px; gap: 40px; }
      .card-back       { font-size: 72px; }
      .card-front      { font-size: 80px; }
      .pony-character  { width: 200px; height: 200px; font-size: 110px; }
      .pony-btn        { width: 140px; height: 140px; font-size: 64px; }
      .count-item      { width: 130px; height: 130px; font-size: 76px; }
      .count-number    { width: 200px; height: 200px; font-size: 100px; }
      .drum            { width: 170px; height: 170px; font-size: 76px; }
      .drums-image     { width: 200px; height: 200px; font-size: 110px; }
    }
    /* ===================================================
       UTILITY — JS state classes
       =================================================== */
    .hidden {
      display: none !important;
    }

    /* ===================================================
       EMOJI ANIMATIONS — triggered on correct answer
       =================================================== */
    .anim-bounce { animation: anim-bounce 0.6s ease 2; }
    .anim-wiggle { animation: anim-wiggle 0.5s ease 3; }
    .anim-spin   { animation: anim-spin   0.7s ease 1; }
    .anim-pulse  { animation: anim-pulse  0.5s ease 3; }
    .anim-rock   { animation: anim-rock   0.6s ease 3; }
    .anim-shake  { animation: anim-shake  0.4s ease 1; }

    @keyframes anim-bounce {
      0%, 100% { transform: translateY(0); }
      40%      { transform: translateY(-24px); }
      60%      { transform: translateY(-8px); }
    }

    @keyframes anim-wiggle {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(8deg); }
      75%      { transform: rotate(-8deg); }
    }

    @keyframes anim-spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes anim-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.25); }
    }

    @keyframes anim-rock {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(12deg); }
      75%      { transform: rotate(-12deg); }
    }

    @keyframes anim-shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-12px); }
      40%      { transform: translateX(12px); }
      60%      { transform: translateX(-8px); }
      80%      { transform: translateX(8px); }
    }

    /* ===================================================
       CONFETTI — lightweight CSS + JS celebration
       =================================================== */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -20px;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      opacity: 0;
      animation: confetti-fall 2.5s ease-out forwards;
    }

    @keyframes confetti-fall {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
      80% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(100vh) rotate(720deg) scale(0.4);
      }
    }
  </style>
</head>
<body>

  <!-- ==============================================
       1.  CO-PLAY HUB  (Main Menu)
       ============================================== -->
  <section id="hub" class="screen active">

    <h1 class="hub-title">Welcome! Which game would you like to play?</h1>

    <div class="hub-grid">
      <button class="hub-btn" data-game="flash" aria-label="Daily Flashcards">
        <span class="hub-emoji">🔤</span>
        <span class="hub-label">Flashcards</span>
      </button>
      <button class="hub-btn" data-game="memory" aria-label="Memory Cards">
        <span class="hub-emoji">🤡</span>
        <span class="hub-label">Memory Game</span>
      </button>
      <button class="hub-btn" data-game="pony" aria-label="Pony Routine">
        <span class="hub-emoji">🐴</span>
        <span class="hub-label">Pony Dress-up</span>
      </button>
      <button class="hub-btn" data-game="count" aria-label="Apple Counting">
        <span class="hub-emoji">🍎</span>
        <span class="hub-label">Numbers</span>
      </button>
      <button class="hub-btn" data-game="drums" aria-label="Rhythm Drums">
        <span class="hub-emoji">🥁</span>
        <span class="hub-label">Music &amp; Rhythm</span>
      </button>
    </div>

  </section>

  <!-- ==============================================
       2.  DAILY FLASHCARDS
       ============================================== -->
  <section id="flash" class="screen">
    <button class="back-btn" aria-label="Back to Hub">🏠</button>

    <div class="flash-pair">
      <button class="flash-choice" id="flash-left" aria-label="Left choice">
        <span class="flash-emoji"></span>
        <span class="flash-word"></span>
      </button>
      <button class="flash-choice" id="flash-right" aria-label="Right choice">
        <span class="flash-emoji"></span>
        <span class="flash-word"></span>
      </button>
    </div>
  </section>

  <!-- ==============================================
       3.  MEMORY MATCH
       ============================================== -->
  <section id="memory" class="screen">
    <button class="back-btn" aria-label="Back to Hub">🏠</button>

    <div class="memory-grid">
      <div class="card" aria-label="Card 1">
        <div class="card-inner">
          <div class="card-face card-back">🤡</div>
          <div class="card-face card-front">🐶</div>
        </div>
      </div>
      <div class="card" aria-label="Card 2">
        <div class="card-inner">
          <div class="card-face card-back">🤡</div>
          <div class="card-face card-front">🐱</div>
        </div>
      </div>
      <div class="card" aria-label="Card 3">
        <div class="card-inner">
          <div class="card-face card-back">🤡</div>
          <div class="card-face card-front">🐶</div>
        </div>
      </div>
      <div class="card" aria-label="Card 4">
        <div class="card-inner">
          <div class="card-face card-back">🤡</div>
          <div class="card-face card-front">🐱</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ==============================================
       4.  PONY MORNING ROUTINE
       ============================================== -->
  <section id="pony" class="screen">
    <button class="back-btn" aria-label="Back to Hub">🏠</button>

    <div class="pony-character" aria-label="Pony">🐴</div>

    <div class="pony-actions">
      <button class="pony-btn" data-action="window" aria-label="Open Window">🪟</button>
      <button class="pony-btn" data-action="toilet" aria-label="Use Toilet">🚽</button>
      <button class="pony-btn" data-action="toothbrush" aria-label="Brush Teeth">🪥</button>
    </div>
  </section>

  <!-- ==============================================
       5.  LET'S COUNT
       ============================================== -->
  <section id="count" class="screen">
    <button class="back-btn" aria-label="Back to Hub">🏠</button>

    <div class="count-objects">
      <div class="count-item" aria-label="Apple 1">🍎</div>
      <div class="count-item" aria-label="Apple 2">🍎</div>
      <div class="count-item" aria-label="Apple 3">🍎</div>
    </div>

    <div class="count-number" aria-label="Number display">3</div>
  </section>

  <!-- ==============================================
       6.  RHYTHM & SYLLABLES
       ============================================== -->
  <section id="drums" class="screen">
    <button class="back-btn" aria-label="Back to Hub">🏠</button>

    <div class="drums-image" aria-label="Word image">🐶</div>

    <div class="drums-row">
      <button class="drum" aria-label="Drum left">🥁</button>
      <button class="drum" aria-label="Drum right">🥁</button>
    </div>
  </section>

  <!-- ==============================================
       JAVASCRIPT ENGINE
       ============================================== -->
  <script>
  (function () {
    'use strict';

    /* ================================================
       1.  VOICE USER INTERFACE (TTS) ENGINE
       ================================================ */
    var synth       = window.speechSynthesis;
    var bestVoice   = null;

    /* Preferred voice names — checked in priority order */
    var voicePrefs  = [
      'google us english', 'samantha', 'victoria',
      'natural', 'female', 'zira', 'karen', 'moira'
    ];

    /**
     * Search loaded voices for the most natural
     * English female voice available on this device.
     */
    function pickVoice() {
      var voices = synth.getVoices();
      if (!voices.length) return;

      /* Priority pass: check each preference keyword */
      for (var p = 0; p < voicePrefs.length; p++) {
        for (var v = 0; v < voices.length; v++) {
          var name = voices[v].name.toLowerCase();
          if (name.indexOf(voicePrefs[p]) !== -1 && voices[v].lang.indexOf('en') === 0) {
            bestVoice = voices[v];
            return;
          }
        }
      }

      /* Fallback: any English voice */
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang.indexOf('en') === 0) {
          bestVoice = voices[i];
          return;
        }
      }
    }

    /* Voices load async on most browsers */
    pickVoice();
    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = pickVoice;
    }

    /**
     * Speak a phrase. Always cancels first to prevent
     * overlapping audio from rapid toddler taps.
     */
    function speak(text, onEnd) {
      synth.cancel();
      var utter  = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.9;
      utter.pitch = 1.2;
      if (bestVoice) utter.voice = bestVoice;
      if (onEnd) utter.onend = onEnd;
      synth.speak(utter);
    }

    /** Fisher-Yates (Knuth) shuffle — in-place. */
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    /* ================================================
       4.  GAME 1 — DAILY FLASHCARDS (Proactive)
       ================================================ */
    var ROUNDS_PER_SESSION = 5;
    var flashDeck  = [];    // shuffled slice for this session
    var flashIndex = 0;
    var flashBusy  = false;
    var targetSide = '';    // 'left' or 'right'

    var leftBtn   = document.getElementById('flash-left');
    var rightBtn  = document.getElementById('flash-right');
    var leftEmoji  = leftBtn.querySelector('.flash-emoji');
    var leftWord   = leftBtn.querySelector('.flash-word');
    var rightEmoji = rightBtn.querySelector('.flash-emoji');
    var rightWord  = rightBtn.querySelector('.flash-word');

    /** Pick a pair: target + one distractor */
    function loadRound() {
      var target = flashDeck[flashIndex];

      /* Pick a random distractor that isn't the target */
      var distractor;
      do {
        distractor = allWords[Math.floor(Math.random() * allWords.length)];
      } while (distractor.word === target.word);

      /* Randomly place target on left or right */
      targetSide = Math.random() < 0.5 ? 'left' : 'right';

      var leftItem  = targetSide === 'left'  ? target : distractor;
      var rightItem = targetSide === 'right' ? target : distractor;

      /* Populate cards — emoji only, word hidden */
      leftEmoji.textContent  = leftItem.emoji;
      leftWord.textContent   = leftItem.word;
      leftWord.classList.remove('visible');
      leftBtn.classList.remove('correct');
      leftBtn.dataset.word      = leftItem.word;
      leftBtn.dataset.animation = leftItem.animation;

      rightEmoji.textContent  = rightItem.emoji;
      rightWord.textContent   = rightItem.word;
      rightWord.classList.remove('visible');
      rightBtn.classList.remove('correct');
      rightBtn.dataset.word      = rightItem.word;
      rightBtn.dataset.animation = rightItem.animation;

      /* Clear any leftover animations */
      clearAnim(leftEmoji);
      clearAnim(rightEmoji);
    }

    function clearAnim(el) {
      el.classList.remove('anim-bounce', 'anim-wiggle', 'anim-spin', 'anim-pulse', 'anim-rock', 'anim-shake');
    }

    function triggerAnim(el, name) {
      clearAnim(el);
      /* Force reflow so re-adding the same class restarts the animation */
      void el.offsetWidth;
      el.classList.add('anim-' + name);
    }

    /** Ask the question for the current round. */
    function askQuestion() {
      var word = flashDeck[flashIndex].word;
      speak('Where is the ' + word + '?');
    }

    /** Initialise a new flashcard session. */
    function initFlashcards() {
      flashIndex = 0;
      flashBusy  = false;
      shuffle(allWords);
      flashDeck = allWords.slice(0, ROUNDS_PER_SESSION);
      loadRound();
      speak("Let's play! Can you find the right picture?", function () {
        askQuestion();
      });
    }

    /** Handle a choice tap. */
    function handleChoice(side) {
      if (flashBusy) return;
      flashBusy = true;

      var isCorrect = (side === targetSide);
      var tappedBtn   = side === 'left' ? leftBtn   : rightBtn;
      var tappedEmoji = side === 'left' ? leftEmoji : rightEmoji;
      var tappedWord  = side === 'left' ? leftWord  : rightWord;
      var correctBtn   = targetSide === 'left' ? leftBtn   : rightBtn;
      var correctEmoji = targetSide === 'left' ? leftEmoji : rightEmoji;
      var correctWord  = targetSide === 'left' ? leftWord  : rightWord;

      if (isCorrect) {
        /* --- CORRECT --- */
        tappedBtn.classList.add('correct');
        triggerAnim(tappedEmoji, tappedBtn.dataset.animation);
        tappedWord.classList.add('visible');

        speak('Yes! ' + flashDeck[flashIndex].word + '!', function () {
          /* Wait 2s then advance */
          setTimeout(function () {
            flashIndex++;
            if (flashIndex < flashDeck.length) {
              loadRound();
              flashBusy = false;
              askQuestion();
            } else {
              /* Session complete! */
              launchConfetti();
              speak('Great job!', function () {
                setTimeout(goToHub, 1500);
              });
            }
          }, 2000);
        });

      } else {
        /* --- INCORRECT — gentle retry --- */
        triggerAnim(tappedEmoji, 'shake');
        var word = flashDeck[flashIndex].word;
        speak('Oops, try again! Where is the ' + word + '?', function () {
          flashBusy = false;
        });
      }
    }

    leftBtn.addEventListener('click', function ()  { handleChoice('left');  });
    rightBtn.addEventListener('click', function () { handleChoice('right'); });

    function launchConfetti() {
      var container = document.createElement('div');
      container.className = 'confetti-container';
      document.body.appendChild(container);

      for (var i = 0; i < 50; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left            = Math.random() * 100 + '%';
        piece.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        piece.style.animationDelay  = (Math.random() * 0.8) + 's';
        piece.style.width           = (8 + Math.random() * 10) + 'px';
        piece.style.height          = (8 + Math.random() * 10) + 'px';
        piece.style.borderRadius    = Math.random() > 0.5 ? '50%' : '3px';
        container.appendChild(piece);
      }

      setTimeout(function () { container.remove(); }, 3500);
    }
