<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>English Playroom</title>

  <!-- Playful balloon-like Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ===================================================
       RESET & BASE
       =================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Arial Rounded MT Bold', 'Nunito', sans-serif;
    }

    /* ===================================================
       SOFT PASTEL COLOR PALETTE
       =================================================== */
    :root {
      --bg-hub:        #FEF3E2;
      --bg-flash:      #E0F2FE;
      --bg-memory:     #EDE9FE;
      --bg-pony:       #FCE7F3;
      --bg-count:      #ECFCCB;
      --bg-drums:      #FEF9C3;

      --card-back:     #C4B5FD;
      --card-front:    #FFFFFF;

      --btn-shadow:    rgba(0, 0, 0, 0.08);
      --btn-active:    rgba(0, 0, 0, 0.04);

      --pastel-pink:   #FBCFE8;
      --pastel-blue:   #BAE6FD;
      --pastel-green:  #BBF7D0;
      --pastel-yellow: #FDE68A;
      --pastel-orange: #FED7AA;
      --pastel-violet: #DDD6FE;

      --radius-sm:     16px;
      --radius-md:     24px;
      --radius-lg:     32px;
      --radius-full:   9999px;

      --gap:           24px;
      --gap-lg:        32px;

      --title-color:   #7C6F64;
      --label-color:   #9C8E82;

      --font-balloon:  'Sour Gummy', 'Comic Sans MS', cursive;
    }

    /* ===================================================
       SCREEN CONTAINER
       =================================================== */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--gap-lg);
      padding-top: calc(var(--gap-lg) + env(safe-area-inset-top, 0px));
      padding-bottom: calc(var(--gap-lg) + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      overflow-x: hidden;
    }

    .screen.active {
      display: flex;
    }

    /* ===================================================
       BACK BUTTON  (🏠 emoji — top-left of every game)
       =================================================== */
    .back-btn {
      position: absolute;
      top: var(--gap);
      left: var(--gap);
      width: 80px;
      height: 80px;
      border: none;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 12px var(--btn-shadow);
      font-size: 40px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .back-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 18px var(--btn-shadow);
    }

    .back-btn:active {
      transform: scale(0.93);
      background: var(--btn-active);
      box-shadow: 0 2px 6px var(--btn-shadow);
    }

    /* ===================================================
       1.  CO-PLAY HUB  (Main Menu)
       =================================================== */
    #hub {
      background: var(--bg-hub);
      gap: 20px;
      justify-content: flex-start;
      padding-top: 36px;
    }

    .hub-title {
      font-family: var(--font-balloon);
      font-size: 26px;
      font-weight: 700;
      color: var(--title-color);
      text-align: center;
      line-height: 1.35;
      padding: 0 var(--gap);
    }

    .hub-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--gap);
      width: 100%;
      max-width: 600px;
      padding: 4px;
    }

    /* --- Individual hub button --- */
    .hub-btn {
      width: 155px;
      height: 170px;
      border: none;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 12px 8px 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--btn-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }

    .hub-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 28px var(--btn-shadow);
    }

    .hub-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px var(--btn-shadow);
    }

    /* Massive emoji inside each hub button */
    .hub-emoji {
      font-size: 80px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* Parent-readable label beneath the emoji */
    .hub-label {
      font-family: var(--font-balloon);
      font-size: 16px;
      font-weight: 400;
      color: var(--label-color);
      white-space: nowrap;
      line-height: 1.2;
    }

    /* Per-game pastel backgrounds */
    .hub-btn[data-game="flash"]   { background: var(--pastel-blue);   }
    .hub-btn[data-game="memory"]  { background: var(--pastel-violet); }
    .hub-btn[data-game="pony"]    { background: var(--pastel-pink);   }
    .hub-btn[data-game="count"]   { background: var(--pastel-green);  }
    .hub-btn[data-game="drums"]   { background: var(--pastel-yellow); }

    /* ===================================================
       2.  DAILY FLASHCARDS SCREEN
       =================================================== */
    #flash {
      background: var(--bg-flash);
      gap: var(--gap-lg);
    }

    .flashcard {
      width: 280px;
      height: 380px;
      perspective: 800px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s ease;
      transform-style: preserve-3d;
      border-radius: var(--radius-lg);
    }

    .flashcard.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 8px 30px var(--btn-shadow);
      padding: var(--gap);
      overflow: hidden;
    }

    .flashcard-front {
      background: #FFFFFF;
    }

    .flashcard-emoji {
      font-size: 120px;
      line-height: 1;
    }

    .flashcard-word {
      font-family: var(--font-balloon);
      font-size: 40px;
      font-weight: 700;
      color: var(--title-color);
    }

    .flashcard-back {
      background: var(--pastel-blue);
      transform: rotateY(180deg);
    }

    .flashcard-back-icon {
      font-size: 80px;
      line-height: 1;
      opacity: 0.6;
    }

    /* hover / active on flashcard */
    .flashcard:hover .flashcard-inner {
      filter: brightness(1.03);
    }

    .flashcard:active .flashcard-inner {
      transform: scale(0.96);
    }

    .flashcard.flipped:active .flashcard-inner {
      transform: rotateY(180deg) scale(0.96);
    }

    /* ===================================================
       3.  MEMORY MATCH SCREEN
       =================================================== */
    #memory {
      background: var(--bg-memory);
    }

    .memory-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap-lg);
      width: 100%;
      max-width: 420px;
    }

    /* Card wrapper (perspective container) */
    .card {
      aspect-ratio: 3 / 4;
      min-height: 120px;
      perspective: 600px;
      cursor: pointer;
    }

    /* Inner card that flips */
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease;
      transform-style: preserve-3d;
      border-radius: var(--radius-md);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* Shared face styling */
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-md);
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--btn-shadow);
      overflow: hidden;
    }

    /* Back face (what you see first) */
    .card-back {
      background: var(--card-back);
      font-size: 56px;
    }

    /* Front face (hidden until flip) */
    .card-front {
      background: var(--card-front);
      transform: rotateY(180deg);
      font-size: 64px;
    }

    /* hover / active feedback on cards */
    .card:hover .card-inner {
      filter: brightness(1.04);
    }

    .card:active .card-inner {
      transform: scale(0.95);
    }

    .card.flipped:active .card-inner {
      transform: rotateY(180deg) scale(0.95);
    }

    /* ===================================================
       4.  PONY MORNING ROUTINE SCREEN
       =================================================== */
    #pony {
      background: var(--bg-pony);
      gap: var(--gap-lg);
    }

    .pony-character {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      line-height: 1;
    }

    .pony-actions {
      display: flex;
      gap: var(--gap-lg);
      flex-wrap: wrap;
      justify-content: center;
    }

    .pony-btn {
      width: 110px;
      height: 110px;
      border: none;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 4px 16px var(--btn-shadow);
      font-size: 50px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .pony-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 22px var(--btn-shadow);
    }

    .pony-btn:active {
      transform: scale(0.92);
      background: var(--pastel-pink);
      box-shadow: 0 2px 8px var(--btn-shadow);
    }

    .pony-btn.done {
      background: var(--pastel-green);
    }

    /* ===================================================
       5.  LET'S COUNT SCREEN
       =================================================== */
    #count {
      background: var(--bg-count);
      gap: var(--gap-lg);
    }

    .count-objects {
      display: flex;
      gap: var(--gap-lg);
      flex-wrap: wrap;
      justify-content: center;
    }

    .count-item {
      width: 100px;
      height: 100px;
      border-radius: var(--radius-md);
      background: #FFFFFF;
      box-shadow: 0 4px 14px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      line-height: 1;
      transition: transform 0.15s ease;
    }

    .count-item:active {
      transform: scale(0.92);
    }

    .count-number {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-balloon);
      font-size: 80px;
      font-weight: 700;
      color: var(--title-color);
    }

    /* ===================================================
       6.  RHYTHM & SYLLABLES SCREEN
       =================================================== */
    #drums {
      background: var(--bg-drums);
      justify-content: space-between;
    }

    .drums-image {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      line-height: 1;
    }

    .drums-row {
      display: flex;
      gap: var(--gap-lg);
      justify-content: center;
      padding-bottom: var(--gap);
    }

    .drum {
      width: 130px;
      height: 130px;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(145deg, var(--pastel-orange), #FDBA74);
      box-shadow: 0 8px 24px var(--btn-shadow), inset 0 -4px 0 rgba(0,0,0,0.06);
      font-size: 60px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .drum:hover {
      transform: scale(1.06);
      box-shadow: 0 10px 30px var(--btn-shadow), inset 0 -4px 0 rgba(0,0,0,0.06);
    }

    .drum:active {
      transform: scale(0.9);
      box-shadow: 0 2px 8px var(--btn-shadow), inset 0 2px 0 rgba(0,0,0,0.04);
    }

    /* ===================================================
       RESPONSIVE — Small phones (≤ 380px)
       =================================================== */
    @media (max-width: 380px) {
      .hub-title       { font-size: 21px; }
      .hub-btn         { width: 130px; height: 145px; }
      .hub-emoji       { font-size: 64px; }
      .hub-label       { font-size: 13px; }
      .flashcard       { width: 240px; height: 320px; }
      .flashcard-emoji { font-size: 90px; }
      .flashcard-word  { font-size: 32px; }
      .pony-character  { width: 130px; height: 130px; font-size: 72px; }
      .pony-btn        { width: 90px;  height: 90px;  font-size: 40px; }
      .count-item      { width: 80px;  height: 80px;  font-size: 48px; }
      .count-number    { width: 130px; height: 130px; font-size: 64px; }
      .drum            { width: 110px; height: 110px; font-size: 48px; }
      .drums-image     { width: 130px; height: 130px; font-size: 72px; }
    }

    /* ===================================================
       RESPONSIVE — Tablets / landscape (≥ 768px)
       =================================================== */
    @media (min-width: 768px) {
      .hub-title       { font-size: 34px; }
      .hub-grid        { max-width: 750px; gap: 36px; }
      .hub-btn         { width: 200px; height: 220px; }
      .hub-emoji       { font-size: 100px; }
      .hub-label       { font-size: 18px; }
      .flashcard       { width: 340px; height: 460px; }
      .flashcard-emoji { font-size: 150px; }
      .flashcard-word  { font-size: 48px; }
      .memory-grid     { max-width: 520px; gap: 40px; }
      .card-back       { font-size: 72px; }
      .card-front      { font-size: 80px; }
      .pony-character  { width: 200px; height: 200px; font-size: 110px; }
      .pony-btn        { width: 140px; height: 140px; font-size: 64px; }
      .count-item      { width: 130px; height: 130px; font-size: 76px; }
      .count-number    { width: 200px; height: 200px; font-size: 100px; }
      .drum            { width: 170px; height: 170px; font-size: 76px; }
      .drums-image     { width: 200px; height: 200px; font-size: 110px; }
    }
    /* ===================================================
       UTILITY — JS state classes
       =================================================== */
    .hidden {
      display: none !important;
    }

    /* Flashcard back — when revealed, show emoji + word */
    .flashcard-back .flashcard-emoji {
      font-size: 100px;
    }

    .flashcard-back .flashcard-word {
      font-family: var(--font-balloon);
      font-size: 36px;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* ===================================================
       CONFETTI — lightweight CSS + JS celebration
       =================================================== */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -20px;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      opacity: 0;
      animation: confetti-fall 2.5s ease-out forwards;
    }

    @keyframes confetti-fall {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
      80% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(100vh) rotate(720deg) scale(0.4);
      }
    }
  </style>
</head>
<body>

  <!-- ==============================================
       1.  CO-PLAY HUB  (Main Menu)
       ============================================== -->
  <section id="hub" class="screen active">

    <h1 class="hub-title">Welcome! Which game would you like to play?</h1>

    <div class="hub-grid">
      <button class="hub-btn" data-game="flash" aria-label="Daily Flashcards">
        <span class="hub-emoji">🔤</span>
        <span class="hub-label">Flashcards</span>
      </button>
      <button class="hub-btn" data-game="memory" aria-label="Memory Cards">
        <span class="hub-emoji">🤡</span>
        <span class="hub-label">Memory Game</span>
      </button>
      <button class="hub-btn" data-game="pony" aria-label="Pony Routine">
        <span class="hub-emoji">🐴</span>
        <span class="hub-label">Pony Dress-up</span>
      </button>
      <button class="hub-btn" data-game="count" aria-label="Apple Counting">
        <span class="hub-emoji">🍎</span>
        <span class="hub-label">Numbers</span>
      </button>
      <button class="hub-btn" data-game="drums" aria-label="Rhythm Drums">
        <span class="hub-emoji">🥁</span>
        <span class="hub-label">Music &amp; Rhythm</span>
      </button>
    </div>

  </section>

  <!-- ==============================================
       2.  DAILY FLASHCARDS
       ============================================== -->
  <section id="flash" class="screen">
    <button class="back-btn" aria-label="Back to Hub">🏠</button>

    <div class="flashcard" aria-label="Flashcard">
      <div class="flashcard-inner">
        <div class="flashcard-face flashcard-front">
          <span class="flashcard-emoji" id="flash-front-emoji">🐱</span>
          <span class="flashcard-word" id="flash-front-word"></span>
        </div>
        <div class="flashcard-face flashcard-back">
          <span class="flashcard-emoji" id="flash-back-emoji">✨</span>
          <span class="flashcard-word" id="flash-back-word"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- ==============================================
       3.  MEMORY MATCH
       ============================================== -->
  <section id="memory" class="screen">
    <button class="back-btn" aria-label="Back to Hub">🏠</button>

    <div class="memory-grid">
      <div class="card" aria-label="Card 1">
        <div class="card-inner">
          <div class="card-face card-back">🤡</div>
          <div class="card-face card-front">🐶</div>
        </div>
      </div>
      <div class="card" aria-label="Card 2">
        <div class="card-inner">
          <div class="card-face card-back">🤡</div>
          <div class="card-face card-front">🐱</div>
        </div>
      </div>
      <div class="card" aria-label="Card 3">
        <div class="card-inner">
          <div class="card-face card-back">🤡</div>
          <div class="card-face card-front">🐶</div>
        </div>
      </div>
      <div class="card" aria-label="Card 4">
        <div class="card-inner">
          <div class="card-face card-back">🤡</div>
          <div class="card-face card-front">🐱</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ==============================================
       4.  PONY MORNING ROUTINE
       ============================================== -->
  <section id="pony" class="screen">
    <button class="back-btn" aria-label="Back to Hub">🏠</button>

    <div class="pony-character" aria-label="Pony">🐴</div>

    <div class="pony-actions">
      <button class="pony-btn" data-action="window" aria-label="Open Window">🪟</button>
      <button class="pony-btn" data-action="toilet" aria-label="Use Toilet">🚽</button>
      <button class="pony-btn" data-action="toothbrush" aria-label="Brush Teeth">🪥</button>
    </div>
  </section>

  <!-- ==============================================
       5.  LET'S COUNT
       ============================================== -->
  <section id="count" class="screen">
    <button class="back-btn" aria-label="Back to Hub">🏠</button>

    <div class="count-objects">
      <div class="count-item" aria-label="Apple 1">🍎</div>
      <div class="count-item" aria-label="Apple 2">🍎</div>
      <div class="count-item" aria-label="Apple 3">🍎</div>
    </div>

    <div class="count-number" aria-label="Number display">3</div>
  </section>

  <!-- ==============================================
       6.  RHYTHM & SYLLABLES
       ============================================== -->
  <section id="drums" class="screen">
    <button class="back-btn" aria-label="Back to Hub">🏠</button>

    <div class="drums-image" aria-label="Word image">🐶</div>

    <div class="drums-row">
      <button class="drum" aria-label="Drum left">🥁</button>
      <button class="drum" aria-label="Drum right">🥁</button>
    </div>
  </section>

  <!-- ==============================================
       JAVASCRIPT ENGINE
       ============================================== -->
  <script>
  (function () {
    'use strict';

    /* ================================================
       1.  VOICE USER INTERFACE (TTS) ENGINE
       ================================================ */
    const synth = window.speechSynthesis;

    /**
     * Speak a phrase using the Web Speech API.
     * Cancels any in-progress utterance first to
     * prevent overlapping audio from rapid taps.
     */
    function speak(text, onEnd) {
      synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang  = 'en-US';
      utter.rate  = 0.85;   // slightly slower for a toddler
      utter.pitch = 1.1;    // slightly higher / friendlier
      if (onEnd) utter.onend = onEnd;
      synth.speak(utter);
    }

    /* ================================================
       2.  NAVIGATION & STATE MANAGEMENT
       ================================================ */
    const screens = document.querySelectorAll('.screen');
    const hub     = document.getElementById('hub');

    /**
     * Show a single screen by id, hiding all others.
     */
    function showScreen(id) {
      screens.forEach(function (s) {
        s.classList.remove('active');
      });
      document.getElementById(id).classList.add('active');
    }

    /** Navigate to the Hub and greet. */
    function goToHub() {
      showScreen('hub');
      speak('What would you like to play?');
    }

    // --- Hub buttons → open game screens ---
    document.querySelectorAll('.hub-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var game = btn.getAttribute('data-game');
        showScreen(game);

        // Per-game greeting
        if (game === 'flash')  initFlashcards();
        if (game === 'memory') speak("Let's find the pairs!");
        if (game === 'pony')   speak("Help pony get ready!");
        if (game === 'count')  speak("Let's count!");
        if (game === 'drums')  speak("Let's make music!");
      });
    });

    // --- All Back buttons → return to Hub ---
    document.querySelectorAll('.back-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        // Reset flashcard state when leaving
        resetFlashcards();
        goToHub();
      });
    });

    /* ================================================
       3.  GAME 1 — DAILY FLASHCARDS
       ================================================ */
    var flashWords = [
      { word: 'Dog',  emoji: '🐶' },
      { word: 'Cat',  emoji: '🐱' },
      { word: 'Bed',  emoji: '🛏️' },
      { word: 'Cup',  emoji: '🥤' },
      { word: 'Ball', emoji: '⚽' }
    ];

    var flashIndex    = 0;   // current position in the deck
    var flashIsFlipped = false;
    var flashBusy      = false; // lock during animation

    var flashcard      = document.querySelector('.flashcard');
    var frontEmoji     = document.getElementById('flash-front-emoji');
    var frontWord      = document.getElementById('flash-front-word');
    var backEmoji      = document.getElementById('flash-back-emoji');
    var backWord       = document.getElementById('flash-back-word');

    /** Load a word onto the card faces (un-flipped state). */
    function loadFlashcard(index) {
      var item = flashWords[index];
      // Front: just the big emoji (child sees this first)
      frontEmoji.textContent = item.emoji;
      frontWord.textContent  = '';
      // Back: emoji + word (revealed on flip)
      backEmoji.textContent  = item.emoji;
      backWord.textContent   = item.word;
    }

    /** Called when entering the Flashcards screen. */
    function initFlashcards() {
      flashIndex    = 0;
      flashIsFlipped = false;
      flashBusy      = false;
      flashcard.classList.remove('flipped');
      loadFlashcard(0);
      speak("Let's learn words!");
    }

    /** Clean up when leaving the screen. */
    function resetFlashcards() {
      flashcard.classList.remove('flipped');
      flashIsFlipped = false;
      flashBusy      = false;
    }

    /** Handle tap on the flashcard. */
    flashcard.addEventListener('click', function () {
      if (flashBusy) return; // ignore taps during animation

      if (!flashIsFlipped) {
        // --- TAP 1: Flip to reveal word ---
        flashBusy = true;
        flashcard.classList.add('flipped');
        flashIsFlipped = true;

        // Wait a moment for the flip to start, then speak
        setTimeout(function () {
          speak(flashWords[flashIndex].word);
          flashBusy = false;
        }, 350);

      } else {
        // --- TAP 2: Un-flip, then advance ---
        flashBusy = true;
        flashcard.classList.remove('flipped');
        flashIsFlipped = false;

        // Wait for flip-back animation to finish
        setTimeout(function () {
          flashIndex++;

          if (flashIndex < flashWords.length) {
            // Load the next word
            loadFlashcard(flashIndex);
            flashBusy = false;
          } else {
            // All done — celebrate!
            launchConfetti();
            speak('Great job!', function () {
              // After praise, pause then return to hub
              setTimeout(goToHub, 1200);
            });
            // Reset for next time
            flashIndex    = 0;
            flashIsFlipped = false;
            loadFlashcard(0);
            flashBusy = false;
          }
        }, 500);
      }
    });

    /* ================================================
       4.  LIGHTWEIGHT CONFETTI EFFECT
       ================================================ */
    var confettiColors = [
      '#FBCFE8', '#BAE6FD', '#BBF7D0',
      '#FDE68A', '#DDD6FE', '#FED7AA',
      '#FECACA', '#C4B5FD'
    ];

    function launchConfetti() {
      var container = document.createElement('div');
      container.className = 'confetti-container';
      document.body.appendChild(container);

      for (var i = 0; i < 40; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left            = Math.random() * 100 + '%';
        piece.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        piece.style.animationDelay  = (Math.random() * 0.8) + 's';
        piece.style.width           = (8 + Math.random() * 10) + 'px';
        piece.style.height          = (8 + Math.random() * 10) + 'px';
        piece.style.borderRadius    = Math.random() > 0.5 ? '50%' : '3px';
        container.appendChild(piece);
      }

      // Remove from DOM after animations complete
      setTimeout(function () {
        container.remove();
      }, 3500);
    }

  })();
  </script>

</body>
</html>
