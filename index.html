<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>English Playroom</title>

  <!-- Playful Google Font for the hub title -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ===================================================
       RESET & BASE
       =================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Arial Rounded MT Bold', 'Nunito', sans-serif;
    }

    img {
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* ===================================================
       SOFT PASTEL COLOR PALETTE
       =================================================== */
    :root {
      --bg-hub:        #FEF3E2;   /* soft peach            */
      --bg-flash:      #E0F2FE;   /* baby blue             */
      --bg-memory:     #EDE9FE;   /* lavender mist         */
      --bg-pony:       #FCE7F3;   /* blush pink            */
      --bg-count:      #ECFCCB;   /* spring green          */
      --bg-drums:      #FEF9C3;   /* buttercup yellow      */

      --card-back:     #C4B5FD;   /* soft violet           */
      --card-front:    #FFFFFF;

      --btn-shadow:    rgba(0, 0, 0, 0.08);
      --btn-active:    rgba(0, 0, 0, 0.04);

      --pastel-pink:   #FBCFE8;
      --pastel-blue:   #BAE6FD;
      --pastel-green:  #BBF7D0;
      --pastel-yellow: #FDE68A;
      --pastel-orange: #FED7AA;
      --pastel-violet: #DDD6FE;
      --pastel-coral:  #FECACA;

      --radius-sm:     16px;
      --radius-md:     24px;
      --radius-lg:     32px;
      --radius-full:   9999px;

      --gap:           24px;
      --gap-lg:        32px;

      --title-color:   #7C6F64;   /* warm brown for title  */
    }

    /* ===================================================
       SCREEN CONTAINER
       Each view is a full-screen, absolutely positioned
       section. Only the one with .active is visible.
       =================================================== */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--gap-lg);
      padding-top: calc(var(--gap-lg) + env(safe-area-inset-top, 0px));
      padding-bottom: calc(var(--gap-lg) + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      overflow-x: hidden;
    }

    .screen.active {
      display: flex;
    }

    /* ===================================================
       BACK BUTTON  (house illustration — top-left)
       =================================================== */
    .back-btn {
      position: absolute;
      top: var(--gap);
      left: var(--gap);
      width: 80px;
      height: 80px;
      border: none;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 12px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      padding: 12px;
    }

    .back-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .back-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 18px var(--btn-shadow);
    }

    .back-btn:active {
      transform: scale(0.93);
      background: var(--btn-active);
      box-shadow: 0 2px 6px var(--btn-shadow);
    }

    /* ===================================================
       1.  CO-PLAY HUB  (Main Menu)
       =================================================== */
    #hub {
      background: var(--bg-hub);
      gap: var(--gap);
      justify-content: flex-start;
      padding-top: 40px;
    }

    .hub-title {
      font-family: 'Sour Gummy', 'Comic Sans MS', cursive;
      font-size: 28px;
      font-weight: 700;
      color: var(--title-color);
      text-align: center;
      line-height: 1.3;
      padding: 0 var(--gap);
      margin-bottom: 8px;
    }

    .hub-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--gap-lg);
      width: 100%;
      max-width: 580px;
      padding: 8px;
    }

    .hub-btn {
      width: 140px;
      height: 140px;
      border: none;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--btn-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }

    .hub-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hub-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 8px 28px var(--btn-shadow);
    }

    .hub-btn:active {
      transform: scale(0.94);
      box-shadow: 0 2px 8px var(--btn-shadow);
    }

    .hub-btn[data-game="flash"]   { background: var(--pastel-blue);   }
    .hub-btn[data-game="memory"]  { background: var(--pastel-violet); }
    .hub-btn[data-game="pony"]    { background: var(--pastel-pink);   }
    .hub-btn[data-game="count"]   { background: var(--pastel-green);  }
    .hub-btn[data-game="drums"]   { background: var(--pastel-yellow); }

    /* ===================================================
       2.  DAILY FLASHCARDS SCREEN
       =================================================== */
    #flash {
      background: var(--bg-flash);
      gap: var(--gap-lg);
    }

    .flashcard {
      width: 280px;
      height: 360px;
      perspective: 800px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s ease;
      transform-style: preserve-3d;
      border-radius: var(--radius-lg);
    }

    .flashcard.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      box-shadow: 0 8px 30px var(--btn-shadow);
      padding: var(--gap);
      overflow: hidden;
    }

    .flashcard-front {
      background: #FFFFFF;
    }

    .flashcard-front .flashcard-img {
      width: 180px;
      height: 180px;
      border-radius: var(--radius-md);
      object-fit: contain;
    }

    .flashcard-front .flashcard-word {
      font-family: 'Sour Gummy', 'Comic Sans MS', cursive;
      font-size: 36px;
      font-weight: 700;
      color: var(--title-color);
    }

    .flashcard-back {
      background: var(--pastel-blue);
      transform: rotateY(180deg);
    }

    .flashcard-back .flashcard-img {
      width: 200px;
      height: 200px;
      border-radius: var(--radius-md);
      object-fit: contain;
    }

    /* hover / active on flashcard */
    .flashcard:hover .flashcard-inner {
      filter: brightness(1.03);
    }

    .flashcard:active .flashcard-inner {
      transform: scale(0.96);
    }

    .flashcard.flipped:active .flashcard-inner {
      transform: rotateY(180deg) scale(0.96);
    }

    /* ===================================================
       3.  MEMORY MATCH SCREEN
       =================================================== */
    #memory {
      background: var(--bg-memory);
    }

    .memory-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap-lg);
      width: 100%;
      max-width: 420px;
    }

    /* Card wrapper (perspective container) */
    .card {
      aspect-ratio: 3 / 4;
      min-height: 120px;
      perspective: 600px;
      cursor: pointer;
    }

    /* Inner card that flips */
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease;
      transform-style: preserve-3d;
      border-radius: var(--radius-md);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* Shared face styling */
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-md);
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--btn-shadow);
      padding: 16px;
      overflow: hidden;
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Back face (what you see first — the clown card back) */
    .card-back {
      background: var(--card-back);
    }

    /* Front face (hidden until flip) */
    .card-front {
      background: var(--card-front);
      transform: rotateY(180deg);
    }

    /* hover / active feedback on cards */
    .card:hover .card-inner {
      filter: brightness(1.04);
    }

    .card:active .card-inner {
      transform: scale(0.95);
    }

    .card.flipped:active .card-inner {
      transform: rotateY(180deg) scale(0.95);
    }

    /* ===================================================
       4.  PONY MORNING ROUTINE SCREEN
       =================================================== */
    #pony {
      background: var(--bg-pony);
      gap: var(--gap-lg);
    }

    .pony-character {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .pony-character img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .pony-actions {
      display: flex;
      gap: var(--gap-lg);
      flex-wrap: wrap;
      justify-content: center;
    }

    .pony-btn {
      width: 110px;
      height: 110px;
      border: none;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 4px 16px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .pony-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .pony-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 22px var(--btn-shadow);
    }

    .pony-btn:active {
      transform: scale(0.92);
      background: var(--pastel-pink);
      box-shadow: 0 2px 8px var(--btn-shadow);
    }

    /* Visual state for completed actions */
    .pony-btn.done {
      background: var(--pastel-green);
    }

    /* ===================================================
       5.  LET'S COUNT SCREEN
       =================================================== */
    #count {
      background: var(--bg-count);
      gap: var(--gap-lg);
    }

    .count-objects {
      display: flex;
      gap: var(--gap-lg);
      flex-wrap: wrap;
      justify-content: center;
    }

    .count-item {
      width: 100px;
      height: 100px;
      border-radius: var(--radius-md);
      background: #FFFFFF;
      box-shadow: 0 4px 14px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
      transition: transform 0.15s ease;
    }

    .count-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .count-item:active {
      transform: scale(0.92);
    }

    .count-number {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Sour Gummy', 'Comic Sans MS', cursive;
      font-size: 80px;
      font-weight: 700;
      color: var(--title-color);
    }

    /* ===================================================
       6.  RHYTHM & SYLLABLES SCREEN
       =================================================== */
    #drums {
      background: var(--bg-drums);
      justify-content: space-between;
    }

    .drums-image {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .drums-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .drums-row {
      display: flex;
      gap: var(--gap-lg);
      justify-content: center;
      padding-bottom: var(--gap);
    }

    .drum {
      width: 130px;
      height: 130px;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(145deg, var(--pastel-orange), #FDBA74);
      box-shadow: 0 8px 24px var(--btn-shadow), inset 0 -4px 0 rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .drum img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .drum:hover {
      transform: scale(1.06);
      box-shadow: 0 10px 30px var(--btn-shadow), inset 0 -4px 0 rgba(0,0,0,0.06);
    }

    .drum:active {
      transform: scale(0.9);
      box-shadow: 0 2px 8px var(--btn-shadow), inset 0 2px 0 rgba(0,0,0,0.04);
    }

    /* ===================================================
       RESPONSIVE — Small phones (≤ 380px)
       =================================================== */
    @media (max-width: 380px) {
      .hub-title       { font-size: 22px; }
      .hub-btn         { width: 110px; height: 110px; }
      .flashcard       { width: 240px; height: 310px; }
      .pony-character  { width: 120px; height: 120px; }
      .pony-btn        { width: 90px;  height: 90px;  }
      .count-item      { width: 80px;  height: 80px;  }
      .count-number    { width: 130px; height: 130px; font-size: 64px; }
      .drum            { width: 110px; height: 110px; }
      .drums-image     { width: 120px; height: 120px; }
    }

    /* ===================================================
       RESPONSIVE — Tablets / landscape (≥ 768px)
       =================================================== */
    @media (min-width: 768px) {
      .hub-title       { font-size: 36px; }
      .hub-grid        { max-width: 700px; gap: 40px; }
      .hub-btn         { width: 180px; height: 180px; }
      .flashcard       { width: 340px; height: 440px; }
      .flashcard-front .flashcard-word { font-size: 44px; }
      .memory-grid     { max-width: 520px; gap: 40px; }
      .pony-character  { width: 200px; height: 200px; }
      .pony-btn        { width: 140px; height: 140px; }
      .count-item      { width: 130px; height: 130px; }
      .count-number    { width: 200px; height: 200px; font-size: 100px; }
      .drum            { width: 170px; height: 170px; }
      .drums-image     { width: 200px; height: 200px; }
    }
  </style>
</head>
<body>

  <!-- ==============================================
       1.  CO-PLAY HUB  (Main Menu)
       ============================================== -->
  <section id="hub" class="screen active">

    <h1 class="hub-title">Welcome! Which game would you like to play?</h1>

    <div class="hub-grid">
      <button class="hub-btn" data-game="flash" aria-label="Daily Flashcards">
        <img src="https://placehold.co/200x200/BAE6FD/5B8FA8?text=ABC&font=poppins" alt="Charming flashcard illustration">
      </button>
      <button class="hub-btn" data-game="memory" aria-label="Memory Cards">
        <img src="https://placehold.co/200x200/DDD6FE/7C6FAA?text=Clown&font=poppins" alt="Charming clown illustration">
      </button>
      <button class="hub-btn" data-game="pony" aria-label="Pony Routine">
        <img src="https://placehold.co/200x200/FBCFE8/A8637C?text=Pony&font=poppins" alt="Cute pony illustration">
      </button>
      <button class="hub-btn" data-game="count" aria-label="Apple Counting">
        <img src="https://placehold.co/200x200/BBF7D0/5E9A72?text=123&font=poppins" alt="Red apple illustration">
      </button>
      <button class="hub-btn" data-game="drums" aria-label="Rhythm Drums">
        <img src="https://placehold.co/200x200/FDE68A/9A8347?text=Drums&font=poppins" alt="Playful drum illustration">
      </button>
    </div>

  </section>

  <!-- ==============================================
       2.  DAILY FLASHCARDS
       ============================================== -->
  <section id="flash" class="screen">
    <button class="back-btn" aria-label="Back to Hub">
      <img src="https://placehold.co/100x100/FFFFFF/7C6F64?text=Home&font=poppins" alt="Back to home">
    </button>

    <div class="flashcard" aria-label="Flashcard">
      <div class="flashcard-inner">
        <div class="flashcard-face flashcard-front">
          <img class="flashcard-img" src="https://placehold.co/300x300/FFF5E6/C4956A?text=Cat&font=poppins" alt="Word illustration">
          <span class="flashcard-word">Cat</span>
        </div>
        <div class="flashcard-face flashcard-back">
          <img class="flashcard-img" src="https://placehold.co/300x300/BAE6FD/5B8FA8?text=Tap+me&font=poppins" alt="Card back illustration">
        </div>
      </div>
    </div>
  </section>

  <!-- ==============================================
       3.  MEMORY MATCH
       ============================================== -->
  <section id="memory" class="screen">
    <button class="back-btn" aria-label="Back to Hub">
      <img src="https://placehold.co/100x100/FFFFFF/7C6F64?text=Home&font=poppins" alt="Back to home">
    </button>

    <div class="memory-grid">
      <div class="card" aria-label="Card 1">
        <div class="card-inner">
          <div class="card-face card-back">
            <img src="https://placehold.co/200x260/C4B5FD/FFFFFF?text=Clown&font=poppins" alt="Card back">
          </div>
          <div class="card-face card-front">
            <img src="https://placehold.co/200x260/FFFFFF/A8637C?text=Dog&font=poppins" alt="Card content">
          </div>
        </div>
      </div>
      <div class="card" aria-label="Card 2">
        <div class="card-inner">
          <div class="card-face card-back">
            <img src="https://placehold.co/200x260/C4B5FD/FFFFFF?text=Clown&font=poppins" alt="Card back">
          </div>
          <div class="card-face card-front">
            <img src="https://placehold.co/200x260/FFFFFF/5E9A72?text=Cat&font=poppins" alt="Card content">
          </div>
        </div>
      </div>
      <div class="card" aria-label="Card 3">
        <div class="card-inner">
          <div class="card-face card-back">
            <img src="https://placehold.co/200x260/C4B5FD/FFFFFF?text=Clown&font=poppins" alt="Card back">
          </div>
          <div class="card-face card-front">
            <img src="https://placehold.co/200x260/FFFFFF/5B8FA8?text=Dog&font=poppins" alt="Card content">
          </div>
        </div>
      </div>
      <div class="card" aria-label="Card 4">
        <div class="card-inner">
          <div class="card-face card-back">
            <img src="https://placehold.co/200x260/C4B5FD/FFFFFF?text=Clown&font=poppins" alt="Card back">
          </div>
          <div class="card-face card-front">
            <img src="https://placehold.co/200x260/FFFFFF/9A8347?text=Cat&font=poppins" alt="Card content">
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ==============================================
       4.  PONY MORNING ROUTINE
       ============================================== -->
  <section id="pony" class="screen">
    <button class="back-btn" aria-label="Back to Hub">
      <img src="https://placehold.co/100x100/FFFFFF/7C6F64?text=Home&font=poppins" alt="Back to home">
    </button>

    <div class="pony-character" aria-label="Pony">
      <img src="https://placehold.co/240x240/FBCFE8/A8637C?text=Pony&font=poppins" alt="Pony character">
    </div>

    <div class="pony-actions">
      <button class="pony-btn" data-action="window" aria-label="Open Window">
        <img src="https://placehold.co/140x140/E0F2FE/5B8FA8?text=Window&font=poppins" alt="Window">
      </button>
      <button class="pony-btn" data-action="toilet" aria-label="Use Toilet">
        <img src="https://placehold.co/140x140/EDE9FE/7C6FAA?text=Toilet&font=poppins" alt="Toilet">
      </button>
      <button class="pony-btn" data-action="toothbrush" aria-label="Brush Teeth">
        <img src="https://placehold.co/140x140/BBF7D0/5E9A72?text=Brush&font=poppins" alt="Toothbrush">
      </button>
    </div>
  </section>

  <!-- ==============================================
       5.  LET'S COUNT
       ============================================== -->
  <section id="count" class="screen">
    <button class="back-btn" aria-label="Back to Hub">
      <img src="https://placehold.co/100x100/FFFFFF/7C6F64?text=Home&font=poppins" alt="Back to home">
    </button>

    <div class="count-objects">
      <div class="count-item" aria-label="Apple 1">
        <img src="https://placehold.co/140x140/FECACA/C45B5B?text=Apple&font=poppins" alt="Apple">
      </div>
      <div class="count-item" aria-label="Apple 2">
        <img src="https://placehold.co/140x140/FECACA/C45B5B?text=Apple&font=poppins" alt="Apple">
      </div>
      <div class="count-item" aria-label="Apple 3">
        <img src="https://placehold.co/140x140/FECACA/C45B5B?text=Apple&font=poppins" alt="Apple">
      </div>
    </div>

    <div class="count-number" aria-label="Number display">3</div>
  </section>

  <!-- ==============================================
       6.  RHYTHM & SYLLABLES
       ============================================== -->
  <section id="drums" class="screen">
    <button class="back-btn" aria-label="Back to Hub">
      <img src="https://placehold.co/100x100/FFFFFF/7C6F64?text=Home&font=poppins" alt="Back to home">
    </button>

    <div class="drums-image" aria-label="Word image">
      <img src="https://placehold.co/240x240/FFF5E6/C4956A?text=Dog&font=poppins" alt="Dog">
    </div>
