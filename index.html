<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>English Playroom</title>

  <!-- Playful balloon-like Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ===================================================
       RESET & BASE
       =================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Arial Rounded MT Bold', 'Nunito', sans-serif;
    }

    /* ===================================================
       SOFT PASTEL COLOR PALETTE
       =================================================== */
    :root {
      --bg-hub:        #FEF3E2;
      --bg-flash:      #E0F2FE;
      --bg-memory:     #EDE9FE;
      --bg-pony:       #FCE7F3;
      --bg-count:      #ECFCCB;
      --bg-drums:      #FEF9C3;

      --card-back:     #C4B5FD;
      --card-front:    #FFFFFF;

      --btn-shadow:    rgba(0, 0, 0, 0.08);
      --btn-active:    rgba(0, 0, 0, 0.04);

      --pastel-pink:   #FBCFE8;
      --pastel-blue:   #BAE6FD;
      --pastel-green:  #BBF7D0;
      --pastel-yellow: #FDE68A;
      --pastel-orange: #FED7AA;
      --pastel-violet: #DDD6FE;

      --radius-sm:     16px;
      --radius-md:     24px;
      --radius-lg:     32px;
      --radius-full:   9999px;

      --gap:           24px;
      --gap-lg:        32px;

      --title-color:   #7C6F64;
      --label-color:   #9C8E82;

      --font-balloon:  'Sour Gummy', 'Comic Sans MS', cursive;
    }

    /* ===================================================
       SCREEN CONTAINER
       =================================================== */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--gap-lg);
      padding-top: calc(var(--gap-lg) + env(safe-area-inset-top, 0px));
      padding-bottom: calc(var(--gap-lg) + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      overflow-x: hidden;
    }

    .screen.active {
      display: flex;
    }

    /* ===================================================
       BACK BUTTON  (🏠 emoji — top-left of every game)
       =================================================== */
    .back-btn {
      position: absolute;
      top: var(--gap);
      left: var(--gap);
      width: 80px;
      height: 80px;
      border: none;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 12px var(--btn-shadow);
      font-size: 40px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .back-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 18px var(--btn-shadow);
    }

    .back-btn:active {
      transform: scale(0.93);
      background: var(--btn-active);
      box-shadow: 0 2px 6px var(--btn-shadow);
    }

    /* ===================================================
       1.  CO-PLAY HUB  (Main Menu)
       =================================================== */
    #hub {
      background: var(--bg-hub);
      gap: 20px;
      justify-content: flex-start;
      padding-top: 36px;
    }

    .hub-title {
      font-family: var(--font-balloon);
      font-size: 26px;
      font-weight: 700;
      color: var(--title-color);
      text-align: center;
      line-height: 1.35;
      padding: 0 var(--gap);
    }

    .hub-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--gap);
      width: 100%;
      max-width: 600px;
      padding: 4px;
    }

    /* --- Individual hub button --- */
    .hub-btn {
      width: 155px;
      height: 170px;
      border: none;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 12px 8px 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--btn-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }

    .hub-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 28px var(--btn-shadow);
    }

    .hub-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px var(--btn-shadow);
    }

    /* Massive emoji inside each hub button */
    .hub-emoji {
      font-size: 80px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* Parent-readable label beneath the emoji */
    .hub-label {
      font-family: var(--font-balloon);
      font-size: 16px;
      font-weight: 400;
      color: var(--label-color);
      white-space: nowrap;
      line-height: 1.2;
    }

    /* Per-game pastel backgrounds */
    .hub-btn[data-game="flash"]   { background: var(--pastel-blue);   }
    .hub-btn[data-game="memory"]  { background: var(--pastel-violet); }
    .hub-btn[data-game="pony"]    { background: var(--pastel-pink);   }
    .hub-btn[data-game="count"]   { background: var(--pastel-green);  }
    .hub-btn[data-game="drums"]   { background: var(--pastel-yellow); }
    .hub-btn[data-game="yoga"]    { background: #CCFBF1;              } /* soft teal */

    /* ===================================================
       2.  DAILY FLASHCARDS — Proactive Two-Card Layout
       =================================================== */
    #flash {
      background: var(--bg-flash);
      gap: var(--gap-lg);
    }

    .flash-pair {
      display: flex;
      gap: var(--gap-lg);
      justify-content: center;
      align-items: stretch;
    }

    .flash-choice {
      width: 155px;
      height: 210px;
      border: 4px solid transparent;
      border-radius: var(--radius-lg);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      padding: 12px;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.3s ease, background 0.3s ease;
    }

    .flash-choice:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 28px var(--btn-shadow);
    }

    .flash-choice:active {
      transform: scale(0.95);
    }

    .flash-emoji {
      font-size: 80px;
      line-height: 1;
    }

    .flash-word {
      font-family: var(--font-balloon);
      font-size: 28px;
      font-weight: 700;
      color: var(--title-color);
      min-height: 36px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .flash-word.visible {
      opacity: 1;
    }

    /* Correct answer glow */
    .flash-choice.correct {
      border-color: #86EFAC;
      background: #F0FFF4;
    }

    /* ===================================================
       3.  MEMORY MATCH SCREEN
       =================================================== */
    #memory {
      background: var(--bg-memory);
      gap: 16px;
      justify-content: center;
    }

    .memory-progress-track {
      width: 80%;
      max-width: 360px;
      height: 18px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: var(--radius-full);
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    }

    .memory-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #C4B5FD, #A78BFA);
      border-radius: var(--radius-full);
      transition: width 0.5s ease;
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 420px;
      padding: 8px;
    }

    /* Force sensible column counts per difficulty */
    .memory-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .memory-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .memory-grid.cols-4 { grid-template-columns: repeat(4, 1fr); max-width: 520px; }

    /* Card wrapper (perspective container) */
    .card {
      aspect-ratio: 3 / 4;
      min-height: 120px;
      perspective: 600px;
      cursor: pointer;
    }

    /* Inner card that flips */
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease;
      transform-style: preserve-3d;
      border-radius: var(--radius-md);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* Shared face styling */
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-md);
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--btn-shadow);
      overflow: hidden;
    }

    /* Back face (what you see first) */
    .card-back {
      background: var(--card-back);
      font-size: 56px;
    }

    /* Front face (hidden until flip) */
    .card-front {
      background: var(--card-front);
      transform: rotateY(180deg);
      font-size: 64px;
    }

    /* hover / active feedback on cards */
    .card:hover .card-inner {
      filter: brightness(1.04);
    }

    .card:active .card-inner {
      transform: scale(0.95);
    }

    .card.flipped:active .card-inner {
      transform: rotateY(180deg) scale(0.95);
    }

    /* Matched pair — stays flipped with green glow */
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }
    .card.matched .card-front {
      box-shadow: 0 0 16px rgba(74, 222, 128, 0.6);
      background: #F0FFF4;
    }
    .card.matched {
      pointer-events: none;
    }

    /* ===================================================
       4.  PONY MORNING ROUTINE SCREEN
       =================================================== */
    #pony {
      background: var(--bg-pony);
      gap: var(--gap);
      justify-content: center;
    }

    .pony-character {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      line-height: 1;
      transition: transform 0.3s ease;
    }

    .pony-step-label {
      font-family: var(--font-balloon);
      font-size: 26px;
      font-weight: 700;
      color: var(--title-color);
      text-align: center;
      min-height: 36px;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .pony-step-label.visible {
      opacity: 1;
    }

    .pony-actions {
      display: flex;
      gap: var(--gap-lg);
      flex-wrap: wrap;
      justify-content: center;
    }

    .pony-btn {
      width: 110px;
      height: 110px;
      border: 4px solid transparent;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 4px 16px var(--btn-shadow);
      font-size: 50px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.3s ease, opacity 0.3s ease;
    }

    .pony-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 22px var(--btn-shadow);
    }

    .pony-btn:active {
      transform: scale(0.92);
      background: var(--pastel-pink);
      box-shadow: 0 2px 8px var(--btn-shadow);
    }

    /* Active step — soft pulse to guide attention */
    .pony-btn.active-step {
      border-color: #F9A8D4;
      animation: pony-guide-pulse 1.2s ease infinite;
    }

    /* Completed step — green check */
    .pony-btn.done {
      background: var(--pastel-green);
      border-color: #86EFAC;
      opacity: 0.7;
      pointer-events: none;
    }

    /* Inactive (not yet reachable) step */
    .pony-btn.inactive {
      opacity: 0.4;
      pointer-events: none;
    }

    @keyframes pony-guide-pulse {
      0%, 100% { transform: scale(1);    box-shadow: 0 4px 16px var(--btn-shadow); }
      50%      { transform: scale(1.08); box-shadow: 0 6px 24px rgba(249,168,212,0.4); }
    }

    /* ===================================================
       5.  LET'S COUNT SCREEN
       =================================================== */
    #count {
      background: var(--bg-count);
      gap: var(--gap-lg);
    }

    .count-objects {
      display: flex;
      gap: var(--gap-lg);
      flex-wrap: wrap;
      justify-content: center;
    }

    .count-item {
      width: 100px;
      height: 100px;
      border-radius: var(--radius-md);
      background: #FFFFFF;
      box-shadow: 0 4px 14px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.3s ease;
    }

    .count-item:active {
      transform: scale(0.92);
    }

    .count-item.popped {
      animation: count-pop 0.4s ease forwards;
      pointer-events: none;
    }

    @keyframes count-pop {
      0%   { transform: scale(1);   opacity: 1; }
      50%  { transform: scale(1.4); opacity: 0.5; }
      100% { transform: scale(0);   opacity: 0; }
    }

    .count-number {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-balloon);
      font-size: 80px;
      font-weight: 700;
      color: var(--title-color);
    }

    /* ===================================================
       6.  RHYTHM & SYLLABLES SCREEN
       =================================================== */
    #drums {
      background: var(--bg-drums);
      justify-content: space-between;
    }

    .drums-image {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 6px 24px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      line-height: 1;
    }

    .drums-row {
      display: flex;
      gap: var(--gap-lg);
      justify-content: center;
      padding-bottom: var(--gap);
    }

    .drum {
      width: 130px;
      height: 130px;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(145deg, var(--pastel-orange), #FDBA74);
      box-shadow: 0 8px 24px var(--btn-shadow), inset 0 -4px 0 rgba(0,0,0,0.06);
      font-size: 60px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .drum:hover {
      transform: scale(1.06);
      box-shadow: 0 10px 30px var(--btn-shadow), inset 0 -4px 0 rgba(0,0,0,0.06);
    }

    .drum:active {
      transform: scale(0.9);
      box-shadow: 0 2px 8px var(--btn-shadow), inset 0 2px 0 rgba(0,0,0,0.04);
    }

    .drum.squish {
      animation: drum-squish 0.15s ease;
    }

    @keyframes drum-squish {
      0%   { transform: scale(1); }
      50%  { transform: scaleX(1.1) scaleY(0.85); }
      100% { transform: scale(1); }
    }

    .drums-word {
      font-family: var(--font-balloon);
      font-size: 28px;
      font-weight: 700;
      color: var(--title-color);
      text-align: center;
    }

    /* ===================================================
       7.  YOGA & STRETCHING SCREEN
       =================================================== */
    #yoga {
      background: #F0FDFA;   /* very soft teal */
      gap: var(--gap-lg);
      justify-content: center;
    }

    .yoga-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--gap);
      cursor: pointer;
      /* entire stage is the tap target */
      padding: var(--gap);
      border-radius: var(--radius-lg);
      transition: transform 0.15s ease;
    }

    .yoga-stage:active {
      transform: scale(0.97);
    }

    .yoga-emoji {
      font-size: 130px;
      line-height: 1;
      /* animation class is toggled by JS */
    }

    .yoga-word {
      font-family: var(--font-balloon);
      font-size: 34px;
      font-weight: 700;
      color: #0F766E;        /* teal title */
      min-height: 44px;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .yoga-word.visible {
      opacity: 1;
    }

    /* ===================================================
       RESPONSIVE — Small phones (≤ 380px)
       =================================================== */
    @media (max-width: 380px) {
      .hub-title            { font-size: 21px; }
      .hub-btn              { width: 110px; height: 125px; }
      .hub-emoji            { font-size: 56px; }
      .hub-label            { font-size: 12px; }
      .flash-choice         { width: 130px; height: 175px; }
      .flash-emoji          { font-size: 64px; }
      .flash-word           { font-size: 22px; }
      .mascot               { width: 54px; height: 54px; font-size: 28px; }
      .yoga-emoji           { font-size: 100px; }
      .yoga-word            { font-size: 26px; }
      .pony-character       { width: 130px; height: 130px; font-size: 72px; }
      .pony-btn             { width: 90px;  height: 90px;  font-size: 40px; }
      .count-item           { width: 80px;  height: 80px;  font-size: 48px; }
      .count-number         { width: 130px; height: 130px; font-size: 64px; }
      .drum                 { width: 110px; height: 110px; font-size: 48px; }
      .drums-image          { width: 130px; height: 130px; font-size: 72px; }
      .memory-level-btn     { width: 90px;  height: 90px;  font-size: 38px; }
      .pony-character       { width: 120px; height: 120px; font-size: 68px; }
      .pony-btn             { width: 80px;  height: 80px;  font-size: 38px; }
      .pony-step-label      { font-size: 20px; }
    }

    /* ===================================================
       RESPONSIVE — Tablets / landscape (≥ 768px)
       =================================================== */
    @media (min-width: 768px) {
      .hub-title            { font-size: 34px; }
      .hub-grid             { max-width: 750px; gap: 36px; }
      .hub-btn              { width: 200px; height: 220px; }
      .hub-emoji            { font-size: 100px; }
      .hub-label            { font-size: 18px; }
      .flash-choice         { width: 200px; height: 270px; }
      .flash-emoji          { font-size: 110px; }
      .flash-word           { font-size: 36px; }
      .memory-grid          { max-width: 520px; gap: 40px; }
      .memory-level-btn     { width: 140px; height: 140px; font-size: 60px; }
      .card-back            { font-size: 72px; }
      .card-front           { font-size: 80px; }
      .pony-character       { width: 200px; height: 200px; font-size: 110px; }
      .pony-btn             { width: 140px; height: 140px; font-size: 64px; }
      .count-item           { width: 130px; height: 130px; font-size: 76px; }
      .count-number         { width: 200px; height: 200px; font-size: 100px; }
      .drum                 { width: 170px; height: 170px; font-size: 76px; }
      .drums-image          { width: 200px; height: 200px; font-size: 110px; }
      .yoga-emoji           { font-size: 180px; }
      .yoga-word            { font-size: 46px; }
    }
    /* ===================================================
       UTILITY — JS state classes
       =================================================== */
    .hidden {
      display: none !important;
    }

    /* ===================================================
       GLOBAL SQUISH — pronounced tactile press on ALL buttons
       =================================================== */
    button:active,
    .card:active .card-inner,
    .yoga-stage:active {
      transform: scale(0.9) !important;
      transition: transform 0.08s ease !important;
    }
    .card.flipped:active .card-inner {
      transform: rotateY(180deg) scale(0.9) !important;
    }

    /* ===================================================
       EMOJI ANIMATIONS — triggered on correct answer
       =================================================== */
    .anim-bounce { animation: anim-bounce 0.6s ease 2; }
    .anim-wiggle { animation: anim-wiggle 0.5s ease 3; }
    .anim-spin   { animation: anim-spin   0.7s ease 1; }
    .anim-pulse  { animation: anim-pulse  0.5s ease 3; }
    .anim-rock   { animation: anim-rock   0.6s ease 3; }
    .anim-shake  { animation: anim-shake  0.4s ease 1; }

    @keyframes anim-bounce {
      0%, 100% { transform: translateY(0); }
      40%      { transform: translateY(-24px); }
      60%      { transform: translateY(-8px); }
    }

    @keyframes anim-wiggle {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(8deg); }
      75%      { transform: rotate(-8deg); }
    }

    @keyframes anim-spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes anim-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.25); }
    }

    @keyframes anim-rock {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(12deg); }
      75%      { transform: rotate(-12deg); }
    }

    @keyframes anim-shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-12px); }
      40%      { transform: translateX(12px); }
      60%      { transform: translateX(-8px); }
      80%      { transform: translateX(8px); }
    }

    /* ===================================================
       PROGRESS BAR — Flashcards game
       =================================================== */
    .progress-track {
      width: 80%;
      max-width: 360px;
      height: 20px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: var(--radius-full);
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #86EFAC, #4ADE80);
      border-radius: var(--radius-full);
      transition: width 0.5s ease;
    }

    /* ===================================================
       SPEAKING MASCOT — VUI visual anchor
       =================================================== */
    .mascot {
      position: absolute;
      top: var(--gap);
      right: var(--gap);
      width: 70px;
      height: 70px;
      border-radius: var(--radius-full);
      background: #FFFFFF;
      box-shadow: 0 4px 14px var(--btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      line-height: 1;
      z-index: 10;
      transition: transform 0.2s ease;
    }

    .mascot.speaking {
      animation: mascot-pulse 0.8s ease infinite;
    }

    /* Correct answer — mascot jumps up big */
    .mascot.react-correct {
      animation: mascot-jump 0.6s ease 1;
      font-size: 48px;
    }

    /* Wrong answer — gentle shake */
    .mascot.react-wrong {
      animation: anim-shake 0.4s ease 1;
    }

    @keyframes mascot-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.15); }
    }

    @keyframes mascot-jump {
      0%       { transform: scale(1) translateY(0); }
      30%      { transform: scale(1.3) translateY(-18px); }
      50%      { transform: scale(1.35) translateY(-24px); }
      70%      { transform: scale(1.2) translateY(-10px); }
      100%     { transform: scale(1) translateY(0); }
    }

       MEMORY — Difficulty Selector Menu
       =================================================== */

      display: flex;
      flex-direction: column;
      align-items: center;

      font-size: 22px;

      color: var(--title-color);
    }

    .memory-levels {

  <script>
  (function () {
    'use strict';

    /* ================================================
       1.  VOICE USER INTERFACE (TTS) ENGINE
       ================================================ */
    var synth       = window.speechSynthesis;
    var bestVoice   = null;

    /*
     * Priority list — first match wins.
     * Covers Chrome (Google), macOS (Samantha/Victoria),
     * Windows (Zira), iOS (Karen), and generic "Natural"
     * or "Premium" neural voices on modern browsers.
     */
    var voicePrefs  = [
      'google us english',
      'samantha',
      'natural',
      'premium',
      'victoria',
      'zira',
      'karen',
      'moira'
    ];

    /**
     * Search loaded voices for the most natural
     * English female voice available on this device.
     */
    function pickVoice() {
      var voices = synth.getVoices();
      if (!voices.length) return;

      /* Priority pass: check each preference keyword */
      for (var p = 0; p < voicePrefs.length; p++) {
        for (var v = 0; v < voices.length; v++) {
          var name = voices[v].name.toLowerCase();
          if (name.indexOf(voicePrefs[p]) !== -1 && voices[v].lang.indexOf('en') === 0) {
            bestVoice = voices[v];
            return;
          }
        }
      }

      /* Fallback: any English voice */
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang.indexOf('en') === 0) {
          bestVoice = voices[i];
          return;
        }
      }
    }

    /* Voices load async on most browsers */
    pickVoice();
    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = pickVoice;
    }

    /* -----------------------------------------------
       Sound Effects — tiny base64 PCM via Web Audio
       ----------------------------------------------- */
    var audioCtx = null;

    function ensureAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    /** Short "pop" — a quick sine burst (70ms). */
    function playPop() {
      var ctx = ensureAudioCtx();
      var osc  = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(660, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.07);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.07);
    }

    /** Gentle "womp" — descending low tone for mismatches (120ms). */
    function playWomp() {
      var ctx = ensureAudioCtx();
      var osc  = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(330, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.12);
    }

    /** Chirpy SFX — short ascending whistle for pony steps (150ms). */
    function playChirp() {
      var ctx = ensureAudioCtx();
      var osc  = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(500, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.15);
    }

    /** "Ding" chime — ascending two-tone (200ms). */
    function playDing() {
      var ctx = ensureAudioCtx();
      var now = ctx.currentTime;
      /* First tone */
      var osc1  = ctx.createOscillator();
      var gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(880, now);
      gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.15);
      /* Second tone — slightly higher, slight delay */
      var osc2  = ctx.createOscillator();
      var gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1320, now + 0.08);
      gain2.gain.setValueAtTime(0.001, now);
      gain2.gain.setValueAtTime(0.3, now + 0.08);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now + 0.08);
      osc2.stop(now + 0.25);
    }

    /** Drum hit — low punchy noise burst (100ms). */
    function playDrumHit() {
      var ctx  = ensureAudioCtx();
      var now  = ctx.currentTime;
      /* Noise via oscillator — low triangle burst */
      var osc  = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.1);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
      /* Click transient for attack */
      var osc2  = ctx.createOscillator();
      var gain2 = ctx.createGain();
      osc2.type = 'square';
      osc2.frequency.setValueAtTime(800, now);
      osc2.frequency.exponentialRampToValueAtTime(200, now + 0.03);
      gain2.gain.setValueAtTime(0.15, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now);
      osc2.stop(now + 0.05);
    }

    /* -----------------------------------------------
       Dynamic Mascot — emoji changes with game state
       ----------------------------------------------- */
    var MASCOT_IDLE    = '🦉';
    var MASCOT_SPEAK   = '🗣️';
    var MASCOT_CORRECT = '🤩';
    var MASCOT_WRONG   = '😅';

    var mascots = {
      flash  : document.getElementById('flash-mascot'),
      memory : document.getElementById('memory-mascot'),
      pony   : document.getElementById('pony-mascot'),
      count  : document.getElementById('count-mascot'),
      drums  : document.getElementById('drums-mascot'),
      yoga   : document.getElementById('yoga-mascot')
    };
    var activeMascot = null;
    var mascotSpeakTimer = null;

    function setActiveMascot(id) {
      activeMascot = mascots[id] || null;
      if (activeMascot) activeMascot.textContent = MASCOT_IDLE;
    }

    function mascotStart() {
      if (!activeMascot) return;
      activeMascot.classList.add('speaking');
      /* Alternate between 🦉 and 🗣️ while speaking */
      var flip = false;
      clearInterval(mascotSpeakTimer);
      mascotSpeakTimer = setInterval(function () {
        flip = !flip;
        activeMascot.textContent = flip ? MASCOT_SPEAK : MASCOT_IDLE;
      }, 400);
    }

    function mascotStop() {
      if (!activeMascot) return;
      clearInterval(mascotSpeakTimer);
      mascotSpeakTimer = null;
      activeMascot.classList.remove('speaking');
      activeMascot.textContent = MASCOT_IDLE;
    }

    /** React to correct/wrong — brief emoji + animation, then revert. */
    function mascotReact(type) {
      if (!activeMascot) return;
      clearInterval(mascotSpeakTimer);
      activeMascot.classList.remove('speaking', 'react-correct', 'react-wrong');
      void activeMascot.offsetWidth; /* reflow to restart animation */

      if (type === 'correct') {
        activeMascot.textContent = MASCOT_CORRECT;
        activeMascot.classList.add('react-correct');
      } else {
        activeMascot.textContent = MASCOT_WRONG;
        activeMascot.classList.add('react-wrong');
      }

      setTimeout(function () {
        if (activeMascot) {
          activeMascot.classList.remove('react-correct', 'react-wrong');
          activeMascot.textContent = MASCOT_IDLE;
        }
      }, 1200);
    }

    /**
     * Speak a phrase.
     * - Always cancels first (prevents overlap from rapid taps).
     * - Pulses the active mascot while speaking.
     * - Calls optional onEnd callback when finished.
     */
    function speak(text, onEnd) {
      synth.cancel();
      var utter   = new SpeechSynthesisUtterance(text);
      utter.lang  = 'en-US';
      utter.rate  = 0.87;   /* natural pace — not robotic      */
      utter.pitch = 1.15;   /* warm, enthusiastic instructor   */
      if (bestVoice) utter.voice = bestVoice;
      utter.onstart = mascotStart;
      utter.onend   = function () {
        mascotStop();
        if (onEnd) onEnd();
      };
      synth.speak(utter);
    }

    /* ================================================
       2.  NAVIGATION & STATE MANAGEMENT
       ================================================ */
    var screens = document.querySelectorAll('.screen');

    function showScreen(id) {
      screens.forEach(function (s) { s.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
    }

    function goToHub() {
      synth.cancel();
      mascotStop();
      activeMascot = null;
      showScreen('hub');
      speak('What would you like to play?');

    /* Hub buttons → open game screens */
    document.querySelectorAll('.hub-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        playPop();
        var game = btn.getAttribute('data-game');
        showScreen(game);

        if (game === 'memory') { initMemory();     return; }
        if (game === 'pony')   { initPony();        return; }
        if (game === 'count')  { initCount();       return; }
        if (game === 'drums')  { initDrums();       return; }
        if (game === 'yoga')   { initYoga();        return; }

    /* All Back buttons → return to Hub */
    document.querySelectorAll('.back-btn').forEach(function (btn) {

        yogaBusy     = false;
        ponyBusy     = false;
        memoryLocked = false;
        countBusy    = false;
        drumsBusy    = false;
        clearTimeout(drumsTimer);
        goToHub();
      });
    });

    /** Fisher-Yates (Knuth) shuffle — in-place. */
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    var rightEmoji   = rightBtn.querySelector('.flash-emoji');
    var rightWord    = rightBtn.querySelector('.flash-word');

    /** Update the progress bar to reflect rounds completed. */
    function setProgress(completed, total) {
      var pct = Math.round((completed / total) * 100);
      progressFill.style.width = pct + '%';
      progressFill.parentElement.setAttribute('aria-valuenow', pct);
    }

    /** Pick a pair: target + one distractor */
    function loadRound() {
      var target = flashDeck[flashIndex];

      var distractor;
      do {
        distractor = allWords[Math.floor(Math.random() * allWords.length)];
      } while (distractor.word === target.word);

      targetSide = Math.random() < 0.5 ? 'left' : 'right';
      var leftItem  = targetSide === 'left'  ? target : distractor;
      var rightItem = targetSide === 'right' ? target : distractor;

      leftEmoji.textContent  = leftItem.emoji;
      leftWord.textContent   = leftItem.word;
      leftWord.classList.remove('visible');
      leftBtn.classList.remove('correct');
      leftBtn.dataset.word      = leftItem.word;
      leftBtn.dataset.animation = leftItem.animation;

      rightEmoji.textContent  = rightItem.emoji;
      rightWord.textContent   = rightItem.word;
      rightWord.classList.remove('visible');
      rightBtn.classList.remove('correct');
      rightBtn.dataset.word      = rightItem.word;
      rightBtn.dataset.animation = rightItem.animation;

      clearAnim(leftEmoji);
      clearAnim(rightEmoji);
    }

    function clearAnim(el) {
      el.classList.remove('anim-bounce', 'anim-wiggle', 'anim-spin', 'anim-pulse', 'anim-rock', 'anim-shake');
    }

    function triggerAnim(el, name) {
      clearAnim(el);
      void el.offsetWidth;
      el.classList.add('anim-' + name);
    }

    function askQuestion() {
      speak('Where is the ' + flashDeck[flashIndex].word + '?');
    }

    function initFlashcards() {
      flashIndex = 0;
      flashBusy  = false;
      setProgress(0, ROUNDS_PER_SESSION);
      shuffle(allWords);
      flashDeck = allWords.slice(0, ROUNDS_PER_SESSION);
      loadRound();
      speak('Welcome! Let\'s play. Listen carefully and tap the right picture!', function () {
        askQuestion();
      });
    }

    function handleChoice(side) {
      if (flashBusy) return;
      playPop();
      flashBusy = true;

      var isCorrect    = (side === targetSide);
      var tappedBtn    = side === 'left' ? leftBtn    : rightBtn;
      var tappedEmoji  = side === 'left' ? leftEmoji  : rightEmoji;
      var tappedWord   = side === 'left' ? leftWord   : rightWord;

      if (isCorrect) {
        playDing();
        mascotReact('correct');
        tappedBtn.classList.add('correct');
        triggerAnim(tappedEmoji, tappedBtn.dataset.animation);
        tappedWord.classList.add('visible');

        setProgress(flashIndex + 1, ROUNDS_PER_SESSION);

        speak('Yes! ' + flashDeck[flashIndex].word + '!', function () {
          setTimeout(function () {
            flashIndex++;
            if (flashIndex < flashDeck.length) {
              loadRound();
              flashBusy = false;

        speak('Oops! Try again. Where is the ' + flashDeck[flashIndex].word + '?', function () {
          flashBusy = false;
        });
      }
    }

    function setMemoryProgress(matched, total) {
      var pct = Math.round((matched / total) * 100);
      memoryProgressFill.style.width = pct + '%';
      memoryProgressTrack.setAttribute('aria-valuenow', pct);
    }

    function buildMemoryCards(cardCount) {
      memoryGrid.innerHTML = '';
      memoryGrid.classList.remove('cols-2', 'cols-3', 'cols-4');

      var pairCount = cardCount / 2;

      if (cardCount <= 4)       memoryGrid.classList.add('cols-2');
      else if (cardCount <= 8)  memoryGrid.classList.add('cols-2');
      else                      memoryGrid.classList.add('cols-3');

      /* Pick N/2 words from the 100-word vocabulary */
      shuffle(allWords);
      var chosen = allWords.slice(0, pairCount);

      /* Build deck: each word appears twice */
      var deck = [];
      for (var c = 0; c < chosen.length; c++) {
        deck.push(chosen[c]);
        deck.push(chosen[c]);
      }
      shuffle(deck);

      for (var i = 0; i < deck.length; i++) {
        var item = deck[i];
        var card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('aria-label', 'Card ' + (i + 1));
        card.dataset.word      = item.word;
        card.dataset.emoji     = item.emoji;
        card.dataset.animation = item.animation;
        card.innerHTML =
          '<div class="card-inner">' +
            '<div class="card-face card-back">🤡</div>' +
            '<div class="card-face card-front">' + item.emoji + '</div>' +
          '</div>';
        memoryGrid.appendChild(card);
      }

      return pairCount;
    }

    function startMemoryGame(cardCount) {
      memoryMenu.classList.add('hidden');
      memoryGrid.classList.remove('hidden');
      memoryProgressTrack.classList.remove('hidden');
      memoryFlipped = [];
      memoryMatched = 0;
      memoryLocked  = false;
      memoryTotal   = buildMemoryCards(cardCount);
      setMemoryProgress(0, memoryTotal);
      speak("Let's find the pairs! Ready?");
    }

    function initMemory() {
      memoryMenu.classList.remove('hidden');
      memoryGrid.classList.add('hidden');
      memoryProgressTrack.classList.add('hidden');
      memoryGrid.innerHTML = '';
      memoryProgressFill.style.width = '0%';
      speak('How many cards would you like?');
    }

    /* Handle card taps via event delegation */
    memoryGrid.addEventListener('click', function (e) {
      if (memoryLocked) return;
      var card = e.target.closest('.card');
      if (!card || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      playPop();
      card.classList.add('flipped');
      memoryFlipped.push(card);

      /* Speak the word on the flipped card */
      speak(card.dataset.word);

      if (memoryFlipped.length === 2) {
        memoryLocked = true;
        var a = memoryFlipped[0];
        var b = memoryFlipped[1];

        /* Wait for the second word to finish before checking */
        setTimeout(function () {
          if (a.dataset.word === b.dataset.word) {
            /* --- MATCH --- */
            memoryMatched++;
            a.classList.add('matched');
            b.classList.add('matched');

            /* Animate the matched emoji */
            var frontA = a.querySelector('.card-front');
            var frontB = b.querySelector('.card-front');
            if (frontA) triggerAnim(frontA, a.dataset.animation);
            if (frontB) triggerAnim(frontB, b.dataset.animation);

            memoryFlipped = [];
            memoryLocked  = false;
            playDing();
            mascotReact('correct');
            setMemoryProgress(memoryMatched, memoryTotal);

            speak('Yes! ' + a.dataset.word + '!', function () {
              if (memoryMatched === memoryTotal) {
                launchConfetti();
                speak('Wow! Amazing memory!', function () {
                  setTimeout(goToHub, 1500);
                });
              }
            });

          } else {
            /* --- MISMATCH --- */
            playWomp();
            mascotReact('wrong');
            speak('Not a match!', function () {
              setTimeout(function () {
                a.classList.remove('flipped');
                b.classList.remove('flipped');
                memoryFlipped = [];
                memoryLocked  = false;
              }, 1500);
            });
          }
        }, 800);
      }
    });

      { name: 'Sun Pose',      emoji: '☀️', animation: 'pulse'  },
      { name: 'Tree Pose',     emoji: '🌳', animation: 'rock'   },
      { name: 'Cat Pose',      emoji: '🐱', animation: 'wiggle' },
      { name: 'Frog Pose',     emoji: '🐸', animation: 'bounce' },
      { name: 'Butterfly',     emoji: '🦋', animation: 'wiggle' },
      { name: 'Star Pose',     emoji: '⭐', animation: 'spin'   },
      { name: 'Bear Hug',      emoji: '🐻', animation: 'rock'   },
      { name: 'Cobra Pose',    emoji: '🐍', animation: 'wiggle' },
      { name: 'Happy Baby',    emoji: '👶', animation: 'rock'   },
      { name: 'Eagle Pose',    emoji: '🦅', animation: 'spin'   },
      { name: 'Flower Pose',   emoji: '🌸', animation: 'pulse'  }
    ];

    var yogaDeck  = [];
    var yogaIndex = 0;
    var yogaBusy  = false;

    var yogaEmojiEl = document.getElementById('yoga-emoji');
    var yogaWordEl  = document.getElementById('yoga-word');
    var yogaStage   = document.getElementById('yoga-stage');

    function loadYogaPose(index) {
      var pose = yogaDeck[index];
      yogaEmojiEl.textContent = pose.emoji;
      yogaWordEl.textContent  = pose.name;
      yogaWordEl.classList.remove('visible');
      clearAnim(yogaEmojiEl);
    }

    function initYoga() {
      yogaIndex = 0;
      yogaBusy  = false;
      shuffle(yogaPoses);
      yogaDeck = yogaPoses.slice();
      loadYogaPose(0);
      speak("Let's stretch! Do the " + yogaDeck[0].name + '! Can you stretch?');
    }

    yogaStage.addEventListener('click', function () {
      if (yogaBusy) return;
      playPop();
      yogaBusy = true;

      var pose = yogaDeck[yogaIndex];

      /* Celebrate the current pose */
      playDing();
      mascotReact('correct');
      triggerAnim(yogaEmojiEl, pose.animation);
      yogaWordEl.classList.add('visible');

      speak('Great job! ' + pose.name + '!', function () {
        setTimeout(function () {
          yogaIndex++;
          if (yogaIndex < yogaDeck.length) {
            loadYogaPose(yogaIndex);
            yogaBusy = false;
            speak("Now do the " + yogaDeck[yogaIndex].name + '! Can you stretch?');
          } else {
            launchConfetti();
            speak('Amazing stretching! You are a yoga star!', function () {
              setTimeout(goToHub, 1500);
            });
          }
        }, 3000);
      });
    });

    /* ================================================
       5.  LIGHTWEIGHT CONFETTI EFFECT
       ================================================ */
    var confettiColors = [
      '#FBCFE8', '#BAE6FD', '#BBF7D0',
      '#FDE68A', '#DDD6FE', '#FED7AA',
      '#FECACA', '#C4B5FD'
    ];

    function launchConfetti() {
      var container = document.createElement('div');
      container.className = 'confetti-container';
      document.body.appendChild(container);

      for (var i = 0; i < 50; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left            = Math.random() * 100 + '%';
        piece.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        piece.style.animationDelay  = (Math.random() * 0.8) + 's';
        piece.style.width           = (8 + Math.random() * 10) + 'px';
        piece.style.height          = (8 + Math.random() * 10) + 'px';
        piece.style.borderRadius    = Math.random() > 0.5 ? '50%' : '3px';
        container.appendChild(piece);
      }

      setTimeout(function () { container.remove(); }, 3500);
    }

  })();
  </script>

</body>
</html>
